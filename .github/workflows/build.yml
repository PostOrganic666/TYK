name: Build Tyk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Generate Xcode project
        run: python3 ToddlerLock/generate_project.py

      - name: Check offline speech coverage
        run: python3 ToddlerLock/tools/generate_speech.py --check

      - name: Build unsigned release
        run: |
          set +e
          xcodebuild \
            -project ToddlerLock/ToddlerLock.xcodeproj \
            -target ToddlerLock \
            -configuration Release \
            SYMROOT="$RUNNER_TEMP/Build" \
            OBJROOT="$RUNNER_TEMP/Intermediates" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Xcode compiler output"
              echo '```text'
              grep -E '(^|[[:space:]])(error:|warning:)|BUILD FAILED' "$RUNNER_TEMP/xcodebuild.log" | tail -n 100
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^|[[:space:]])error:|BUILD FAILED' "$RUNNER_TEMP/xcodebuild.log" \
              | tail -n 20 \
              | while IFS= read -r line; do
                  echo "::error title=Xcode compiler::$line"
                done
          fi
          exit "$status"

      - name: Sign local build ad-hoc
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/Build/Release" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          codesign --force --deep --sign - \
            --entitlements ToddlerLock/ToddlerLock/App/ToddlerLock.entitlements \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Tyk-macOS.zip"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Tyk-macOS
          path: ${{ runner.temp }}/Tyk-macOS.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish v0.4.0 prerelease
        if: github.ref == 'refs/heads/codex/toddler-fork'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            gh release upload v0.4.0 "$RUNNER_TEMP/Tyk-macOS.zip" --clobber
          else
            gh release create v0.4.0 "$RUNNER_TEMP/Tyk-macOS.zip" \
              --target "$GITHUB_SHA" \
              --title "Тык 0.4.0 — 190 картинок и офлайн-голос Kore" \
              --notes "90 животных, 50 видов транспорта и новый режим «Дома» с 50 предметами. Женский голос Kore: 224 готовые записи работают офлайн. Каталог отмечает покрытие озвучки; её проверка выполняется перед сборкой. Universal-приложение для Apple Silicon и Intel." \
              --prerelease
          fi
